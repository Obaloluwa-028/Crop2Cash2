<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Crop2Cash — Market Board
  </title>

  <link
    rel="stylesheet"
    href="assets/css/app.css"
  >

</head>

<body class="app-page">

  <aside class="sidebar">

    <a
      class="brand"
      href="dashboard.html"
    >

      <span class="brand-mark">
        C2C
      </span>

      <span>
        Crop2Cash
      </span>

    </a>

    <nav>

      <a href="dashboard.html">
        Overview
      </a>

      <a href="analyze.html">
        Analyze harvest
      </a>

      <a href="history.html">
        History
      </a>

      <a
        class="active"
        href="markets.html"
      >
        Market board
      </a>

      <a href="profile.html">
        Profile
      </a>

    </nav>

    <button
      id="logoutBtn"
      class="btn ghost full"
    >
      Sign out
    </button>

  </aside>

  <main class="app-main">

    <div class="mobile-top">

      <a
        class="brand"
        href="dashboard.html"
      >

        <span class="brand-mark">
          C2C
        </span>

        <span>
          Crop2Cash
        </span>

      </a>

      <button id="openNav">
        ☰
      </button>

    </div>

    <header class="app-head">

      <div>

        <span class="kicker">
          MARKET INTELLIGENCE
        </span>

        <h1>
          Market board
        </h1>

        <p class="muted">
          Record buyer quotes and compare
          the real economics of selling.
        </p>

      </div>

    </header>

    <section class="dashboard-grid">

      <div class="panel">

        <span class="kicker">
          ADD QUOTE
        </span>

        <h2>
          Record a market price
        </h2>

        <form id="quoteForm">

          <label>
            Market / buyer location
            <input
              id="marketName"
              placeholder="Dawanau Market"
              required
            >
          </label>

          <label>
            Crop
            <input
              id="marketCrop"
              placeholder="Tomatoes"
              required
            >
          </label>

          <div class="two-col">

            <label>
              Price
              <input
                id="marketPrice"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="35500"
                required
              >
            </label>

            <label>
              Unit
              <select id="marketUnit">
                <option>per crate</option>
                <option>per bag</option>
                <option>per kg</option>
                <option>per tonne</option>
                <option>per piece</option>
              </select>
            </label>

          </div>

          <div class="two-col">

            <label>
              Distance
              <span class="label-note">
                kilometres
              </span>

              <input
                id="marketDistance"
                type="number"
                min="0"
                step="0.1"
                placeholder="12"
              >
            </label>

            <label>
              Buyer type

              <select id="buyerType">

                <option>
                  Market buyer
                </option>

                <option>
                  Wholesaler
                </option>

                <option>
                  Processor
                </option>

                <option>
                  Retailer
                </option>

                <option>
                  Cooperative
                </option>

                <option>
                  Other
                </option>

              </select>

            </label>

          </div>

          <label>
            Quote date
            <input
              id="quoteDate"
              type="date"
              required
            >
          </label>

          <label>
            Notes
            <textarea
              id="quoteNotes"
              rows="3"
              placeholder="Grade, buyer conditions, phone, packaging requirements..."
            ></textarea>
          </label>

          <button
            class="btn primary full"
            type="submit"
          >
            Save quote
          </button>

          <p
            id="quoteMsg"
            class="form-msg"
          ></p>

        </form>

      </div>

      <div class="panel">

        <span class="kicker">
          YOUR QUOTES
        </span>

        <h2>
          Current market signals
        </h2>

        <div id="quotesList"></div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/markets.js"></script>

</body>

</html>
